<div class="dashboard-header">
  <h1>Dashboard</h1>
  <p>Bienvenido al panel de administración</p>
</div>

<!-- Top 5 Productos -->
<div class="top-products-section">
  <div class="section-header">
    <h2>Productos más vendidos</h2>
  </div>

  <div class="top-filters">
    <div class="date-field">
      <label>Desde</label>
      <input type="date" [(ngModel)]="dateFrom" class="date-input" />
    </div>
    <div class="date-field">
      <label>Hasta</label>
      <input type="date" [(ngModel)]="dateTo" class="date-input" />
    </div>
    <button class="btn-search" (click)="loadTopProducts()">
      <span class="material-icons">filter_list</span>
      Filtrar
    </button>
  </div>

  <div class="error-message" *ngIf="errorTop">
    <span class="material-icons">error</span>
    {{ errorTop }}
  </div>

  <div class="loading" *ngIf="loadingTop">
    <span class="material-icons spinning">sync</span>
    Cargando productos...
  </div>

  <div class="top-grid" *ngIf="!loadingTop && topProducts.length > 0">
    <div class="top-card" *ngFor="let product of topProducts; let i = index">
      <div class="top-rank">#{{ i + 1 }}</div>
      <div class="top-info">
        <h3 class="top-name">{{ product.name }}</h3>
        <p class="top-code">{{ product.code }}</p>
      </div>
      <div class="top-quantity">
        <span class="quantity-value">{{ product.quantity }}</span>
        <span class="quantity-label">vendidos</span>
      </div>
      <div class="top-images" *ngIf="getImageList(product.images).length > 0">
        <img
          *ngFor="let img of getImageList(product.images)"
          [src]="img"
          alt="{{ product.name }}"
          class="product-thumb"
        />
      </div>
    </div>
  </div>

  <div class="empty-state" *ngIf="!loadingTop && topProducts.length === 0 && !errorTop">
    <span class="material-icons">emoji_events</span>
    <p>No hay datos de ventas en el rango seleccionado</p>
  </div>
</div>
