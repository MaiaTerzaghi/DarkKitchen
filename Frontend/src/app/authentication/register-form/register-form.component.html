<div class="login-wrapper">
  <div class="bg-image"></div>
  <div class="bg-overlay"></div>
  <div class="bg-radial"></div>

  <div class="blob blob-purple"></div>
  <div class="blob blob-orange"></div>

  <div class="login-content">
    <div class="login-header">
      <div class="logo-icon">
        <span class="material-icons">restaurant</span>
      </div>
      <h1 class="app-title">DarkKitchen</h1>
      <p class="app-subtitle">Crear cuenta nueva</p>
    </div>

    <div class="login-card">
      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        <div class="row-fields">
          <div class="field-group half">
            <label for="name">Nombre</label>
            <div class="input-wrapper">
              <span class="material-icons input-icon">person</span>
              <input
                id="name"
                type="text"
                formControlName="name"
                placeholder="Nombre"
              />
            </div>
          </div>

          <div class="field-group half">
            <label for="lastName">Apellido</label>
            <div class="input-wrapper">
              <span class="material-icons input-icon">person</span>
              <input
                id="lastName"
                type="text"
                formControlName="lastName"
                placeholder="Apellido"
              />
            </div>
          </div>
        </div>

        <div class="field-group">
          <label for="email">Correo electrónico</label>
          <div class="input-wrapper">
            <span class="material-icons input-icon">mail</span>
            <input
              id="email"
              type="email"
              formControlName="email"
              placeholder="tu@email.com"
            />
          </div>
        </div>

        <div class="field-group">
          <label for="phone">Teléfono</label>
          <div class="input-wrapper">
            <span class="material-icons input-icon">phone</span>
            <input
              id="phone"
              type="tel"
              formControlName="phone"
              placeholder="+598 99 123 456"
            />
          </div>
        </div>

        <div class="field-group">
          <label for="password">Contraseña</label>
          <div class="input-wrapper">
            <span class="material-icons input-icon">lock</span>
            <input
              id="password"
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
              placeholder="••••••••"
            />
            <button type="button" class="toggle-password" (click)="togglePassword()">
              <span class="material-icons">{{ showPassword ? 'visibility_off' : 'visibility' }}</span>
            </button>
          </div>
        </div>

        <div class="field-group">
          <label for="confirmPassword">Confirmar contraseña</label>
          <div class="input-wrapper">
            <span class="material-icons input-icon">lock</span>
            <input
              id="confirmPassword"
              [type]="showConfirmPassword ? 'text' : 'password'"
              formControlName="confirmPassword"
              placeholder="••••••••"
            />
            <button type="button" class="toggle-password" (click)="toggleConfirmPassword()">
              <span class="material-icons">{{ showConfirmPassword ? 'visibility_off' : 'visibility' }}</span>
            </button>
          </div>
        </div>

        <p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>
        <p class="success-message" *ngIf="successMessage">{{ successMessage }}</p>

        <button type="submit" class="submit-btn" [disabled]="registerForm.invalid">
          Crear cuenta
        </button>
      </form>

      <p class="signup-text">
        ¿Ya tienes cuenta? <a routerLink="/login" class="signup-link">Inicia sesión</a>
      </p>
    </div>
  </div>
</div>
