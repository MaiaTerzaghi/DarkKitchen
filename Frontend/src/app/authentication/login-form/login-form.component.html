<div class="login-wrapper">
  <div class="bg-image"></div>
  <div class="bg-overlay"></div>
  <div class="bg-radial"></div>

  <div class="blob blob-purple"></div>
  <div class="blob blob-orange"></div>

  <div class="login-content">
    <!-- Logo y titulo -->
    <div class="login-header">
      <div class="logo-icon">
        <span class="material-icons">restaurant</span>
      </div>
      <h1 class="app-title">DarkKitchen</h1>
      <p class="app-subtitle">Sistema de gestión profesional</p>
    </div>

    <!-- Login card -->
    <div class="login-card">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="field-group">
          <label for="email">Correo electrónico</label>
          <div class="input-wrapper">
            <span class="material-icons input-icon">mail</span>
            <input
              id="email"
              type="email"
              formControlName="email"
              placeholder="tu@email.com"
            />
          </div>
        </div>

        <div class="field-group">
          <label for="password">Contraseña</label>
          <div class="input-wrapper">
            <span class="material-icons input-icon">lock</span>
            <input
              id="password"
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
              placeholder="••••••••"
            />
            <button type="button" class="toggle-password" (click)="togglePassword()">
              <span class="material-icons">{{ showPassword ? 'visibility_off' : 'visibility' }}</span>
            </button>
          </div>
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" />
            <span>Recordarme</span>
          </label>
          <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
        </div>

        <p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>

        <button type="submit" class="submit-btn" [disabled]="loginForm.invalid">
          Iniciar sesión
        </button>
      </form>

      <p class="signup-text">
        ¿No tienes cuenta? <a routerLink="/register" class="signup-link">Regístrate aquí</a>
      </p>
    </div>
  </div>
</div>
